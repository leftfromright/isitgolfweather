<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is It Golf Weather?</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1a202c;
      --text-muted: #4a5568;
      --border: #e2e8f0;
      --accent: #2e7d32;
      --accent-hover: #1b5e20;
    }

    [data-theme="dark"] {
      --bg: #12181b;
      --card-bg: #1e262c;
      --text: #f7fafc;
      --text-muted: #a0aec0;
      --border: #2d3748;
      --accent: #4caf50;
      --accent-hover: #388e3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 { font-size: 1.5rem; }

    .controls { display: flex; gap: 0.5rem; }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { border-color: var(--accent); }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .temp-large {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .grid-item {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 4px;
    }
    .grid-item .label { font-size: 0.85rem; color: var(--text-muted); }
    .grid-item .value { font-size: 1.1rem; font-weight: bold; }

    .tag {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 0.5rem;
    }
    .tag-wet { background: #e3f2fd; color: #0d47a1; }
    .tag-dry { background: #e8f5e9; color: #1b5e20; }
    .tag-windy { background: #fff3e0; color: #e65100; }

    #status { margin-bottom: 1rem; font-style: italic; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Is It Golf Weather?</h1>
    <div class="controls">
      <button id="unitToggle">°C</button>
      <button id="themeToggle">🌙</button>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="locationInput" placeholder="Enter city (e.g. London, Leamington Spa)...">
    <button id="searchBtn">Search</button>
    <button id="geoBtn" title="Use current location">📍</button>
  </div>

  <div id="status">Locating...</div>

  <div id="weatherContent" style="display: none;">
    <!-- Golf Impact / Ground Assessment -->
    <div class="card">
      <h2>Golf Conditions & Ground Status</h2>
      <div id="assessment"></div>
    </div>

    <!-- Right Now -->
    <div class="card">
      <h2>Right Now (<span id="locationName">---</span>)</h2>
      <div class="temp-large" id="currentTemp">--</div>
      <div id="currentCondition">--</div>
      <div class="grid">
        <div class="grid-item">
          <div class="label">Wind Speed</div>
          <div class="value" id="currentWind">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Wind Gusts</div>
          <div class="value" id="currentGusts">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Recent Rain (24h)</div>
          <div class="value" id="recentRain">--</div>
        </div>
      </div>
    </div>

    <!-- Today's Forecast -->
    <div class="card">
      <h2>Today's Forecast Summary</h2>
      <div class="grid">
        <div class="grid-item">
          <div class="label">High / Low</div>
          <div class="value" id="tempRange">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Total Expected Rain</div>
          <div class="value" id="todayRain">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Max Wind</div>
          <div class="value" id="maxWind">--</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // State
  let currentUnit = 'C'; // 'C' or 'F'
  let currentData = null;
  let currentCityName = '';

  // DOM Elements
  const unitToggle = document.getElementById('unitToggle');
  const themeToggle = document.getElementById('themeToggle');
  const searchBtn = document.getElementById('searchBtn');
  const geoBtn = document.getElementById('geoBtn');
  const locationInput = document.getElementById('locationInput');
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('weatherContent');

  // WMO Weather Interpretation Codes
  function getWeatherDescription(code) {
    const codes = {
      0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
      45: 'Fog', 48: 'Depositing rime fog', 51: 'Light drizzle', 53: 'Moderate drizzle',
      55: 'Dense drizzle', 61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
      71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow', 80: 'Slight rain showers',
      81: 'Moderate rain showers', 82: 'Violent rain showers', 95: 'Thunderstorm'
    };
    return codes[code] || 'Unknown';
  }

  // Fetch Weather from Lat/Lon using Open-Meteo
  async function fetchWeather(lat, lon, locationName = '') {
    statusEl.textContent = 'Fetching weather data...';
    try {
      // Requests current metrics + 24h past rain + today's forecast
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&hourly=precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&past_days=1&forecast_days=1&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      
      currentData = data;
      currentCityName = locationName || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
      
      render();
      statusEl.textContent = '';
      contentEl.style.display = 'block';
    } catch (err) {
      statusEl.textContent = 'Error loading weather data. Please try again.';
      console.error(err);
    }
  }

  // Geocoding via Open-Meteo
  async function searchLocation(query) {
    if (!query) return;
    statusEl.textContent = `Searching for "${query}"...`;
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
      const data = await res.json();
      if (data.results && data.results.length > 0) {
        const place = data.results[0];
        const displayName = `${place.name}${place.admin1 ? ', ' + place.admin1 : ''}`;
        fetchWeather(place.latitude, place.longitude, displayName);
      } else {
        statusEl.textContent = 'Location not found. Try another search.';
      }
    } catch (err) {
      statusEl.textContent = 'Failed to find location.';
    }
  }

  // Render Data
  function render() {
    if (!currentData) return;

    const isF = currentUnit === 'F';
    const c = currentData.current;
    const d = currentData.daily;
    const h = currentData.hourly;

    // Unit conversions
    const toTemp = (valC) => isF ? Math.round((valC * 9/5) + 32) + '°F' : Math.round(valC) + '°C';
    const toSpeed = (valKmh) => isF ? Math.round(valKmh / 1.609) + ' mph' : Math.round(valKmh) + ' km/h';
    const toPrecip = (valMm) => isF ? (valMm / 25.4).toFixed(2) + ' in' : valMm.toFixed(1) + ' mm';

    // Calculate last 24h rain from hourly array
    const last24hRain = h.precipitation.slice(0, 24).reduce((a, b) => a + b, 0);

    // Update Text
    document.getElementById('locationName').textContent = currentCityName;
    document.getElementById('currentTemp').textContent = toTemp(c.temperature_2m);
    document.getElementById('currentCondition').textContent = getWeatherDescription(c.weather_code);
    document.getElementById('currentWind').textContent = toSpeed(c.wind_speed_10m);
    document.getElementById('currentGusts').textContent = toSpeed(c.wind_gusts_10m);
    document.getElementById('recentRain').textContent = toPrecip(last24hRain);

    document.getElementById('tempRange').textContent = `${toTemp(d.temperature_2m_min[0])} / ${toTemp(d.temperature_2m_max[0])}`;
    document.getElementById('todayRain').textContent = toPrecip(d.precipitation_sum[0]);
    document.getElementById('maxWind').textContent = toSpeed(d.wind_speed_10m_max[0]);

    // Ground condition & wind logic
    let assessmentHTML = '';
    
    if (last24hRain > 10) {
      assessmentHTML += `<p><strong>Ground:</strong> Very wet / Soft underfoot. Expect casual water in low areas and limited ball roll on fairways.</p>`;
    } else if (last24hRain > 2) {
      assessmentHTML += `<p><strong>Ground:</strong> Damp underfoot. Standard playing conditions with moderate roll.</p>`;
    } else {
      assessmentHTML += `<p><strong>Ground:</strong> Dry / Firm. Expect good fairway roll and firm greens.</p>`;
    }

    if (c.wind_speed_10m > 30) {
      assessmentHTML += `<p><strong>Wind Impact:</strong> Heavy wind. Will significantly affect club selection (2–3 clubs difference into wind).</p>`;
    } else if (c.wind_speed_10m > 15) {
      assessmentHTML += `<p><strong>Wind Impact:</strong> Moderate breeze. Factor in 1 club difference on exposed holes.</p>`;
    } else {
      assessmentHTML += `<p><strong>Wind Impact:</strong> Light breeze. Minimal impact on ball flight.</p>`;
    }

    document.getElementById('assessment').innerHTML = assessmentHTML;
  }

  // Handlers & Event Listeners
  unitToggle.addEventListener('click', () => {
    currentUnit = currentUnit === 'C' ? 'F' : 'C';
    unitToggle.textContent = `°${currentUnit}`;
    render();
  });

  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeToggle.textContent = isDark ? '🌙' : '☀️';
  });

  searchBtn.addEventListener('click', () => {
    searchLocation(locationInput.value);
  });

  locationInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchLocation(locationInput.value);
  });

  geoBtn.addEventListener('click', getUserLocation);

  function getUserLocation() {
    if (navigator.geolocation) {
      statusEl.textContent = 'Getting your location...';
      navigator.geolocation.getCurrentPosition(
        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, 'Your Location'),
        () => {
          statusEl.textContent = 'Geolocation permission denied. Defaulting to London...';
          fetchWeather(51.5074, -0.1278, 'London');
        }
      );
    } else {
      fetchWeather(51.5074, -0.1278, 'London');
    }
  }

  // Initial load
  getUserLocation();
</script>
</body>
</html>
