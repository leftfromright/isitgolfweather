<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is It Golf Weather?</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1a202c;
      --text-muted: #4a5568;
      --border: #e2e8f0;
      --accent: #2e7d32;
    }

    [data-theme="dark"] {
      --bg: #12181b;
      --card-bg: #1e262c;
      --text: #f7fafc;
      --text-muted: #a0aec0;
      --border: #2d3748;
      --accent: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .version-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    h1 { font-size: 1.4rem; }

    .controls { display: flex; gap: 0.4rem; }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .temp-large {
      font-size: 2.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .grid-item {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 4px;
    }
    .grid-item .label { font-size: 0.8rem; color: var(--text-muted); }
    .grid-item .value { font-size: 1.05rem; font-weight: bold; display: flex; align-items: center; gap: 0.3rem; }

    #status { margin-bottom: 1rem; font-style: italic; color: var(--text-muted); font-size: 0.9rem; }
    
    .location-badge {
      font-size: 0.85rem;
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      display: inline-block;
      margin-top: 0.25rem;
    }

    /* Date Selector */
    .date-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .date-btn {
      flex: 0 0 auto;
      text-align: center;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
    }
    .date-btn .day { font-weight: bold; display: block; }
    .date-btn .date { font-size: 0.75rem; opacity: 0.8; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Is It Golf Weather?</h1>
    <div class="controls">
      <button id="unitToggle">°C</button>
      <button id="speedToggle">mph</button>
      <button id="themeToggle">🌙</button>
    </div>
  </header>
  <div class="version-tag">Version 0.2 (Alpha)</div>

  <div class="search-box">
    <input type="text" id="locationInput" placeholder="Enter city (e.g. London, Leamington Spa)...">
    <button id="searchBtn">Search</button>
    <button id="geoBtn" title="Use current location">📍 Find Me</button>
  </div>

  <div id="status">Loading location...</div>

  <div id="weatherContent" style="display: none;">
    
    <!-- Upcoming Date Bar -->
    <div class="date-bar" id="dateBar"></div>

    <!-- Golf Assessment -->
    <div class="card">
      <h2>Golf Conditions & Ground Status</h2>
      <div id="assessment"></div>
    </div>

    <!-- Weather Overview -->
    <div class="card">
      <h2><span id="dayLabel">Right Now</span> (<span id="locationName">---</span>)</h2>
      <div id="locationBadge" class="location-badge" style="display:none;"></div>
      <div class="temp-large">
        <span id="weatherIcon">☀️</span>
        <span id="currentTemp">--</span>
      </div>
      <div id="currentCondition">--</div>
      
      <div class="grid">
        <div class="grid-item">
          <div class="label">Wind Speed</div>
          <div class="value">
            <span id="windIcon">🍃</span>
            <span id="currentWind">--</span>
          </div>
        </div>
        <div class="grid-item">
          <div class="label">Wind Gusts</div>
          <div class="value" id="currentGusts">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Recent Rain (24h)</div>
          <div class="value" id="recentRain">--</div>
        </div>
      </div>
    </div>

    <!-- Day Summary -->
    <div class="card">
      <h2>Day Summary</h2>
      <div class="grid">
        <div class="grid-item">
          <div class="label">High / Low</div>
          <div class="value" id="tempRange">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Total Expected Rain</div>
          <div class="value" id="todayRain">--</div>
        </div>
        <div class="grid-item">
          <div class="label">Max Wind</div>
          <div class="value" id="maxWind">--</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // State
  let currentUnit = 'C'; // 'C' or 'F'
  let speedUnit = 'mph'; // 'mph', 'kmh', 'ms'
  let currentData = null;
  let currentCityName = '';
  let preciseCoords = '';
  let selectedDayIndex = 0; // 0 = today, 1 = tomorrow, etc.

  // DOM Elements
  const unitToggle = document.getElementById('unitToggle');
  const speedToggle = document.getElementById('speedToggle');
  const themeToggle = document.getElementById('themeToggle');
  const searchBtn = document.getElementById('searchBtn');
  const geoBtn = document.getElementById('geoBtn');
  const locationInput = document.getElementById('locationInput');
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('weatherContent');
  const locationBadge = document.getElementById('locationBadge');
  const dateBar = document.getElementById('dateBar');

  // WMO Weather Interpretation & Icons
  function getWeatherInfo(code) {
    const codes = {
      0: { text: 'Clear sky', icon: '☀️' },
      1: { text: 'Mainly clear', icon: '🌤️' },
      2: { text: 'Partly cloudy', icon: '⛅' },
      3: { text: 'Overcast', icon: '☁️' },
      45: { text: 'Fog', icon: '🌫️' },
      48: { text: 'Depositing rime fog', icon: '🌫️' },
      51: { text: 'Light drizzle', icon: '🌦️' },
      53: { text: 'Moderate drizzle', icon: '🌧️' },
      55: { text: 'Dense drizzle', icon: '🌧️' },
      61: { text: 'Slight rain', icon: '🌧️' },
      63: { text: 'Moderate rain', icon: '🌧️' },
      65: { text: 'Heavy rain', icon: '🌧️☔' },
      71: { text: 'Slight snow', icon: '🌨️' },
      73: { text: 'Moderate snow', icon: '❄️' },
      75: { text: 'Heavy snow', icon: '❄️' },
      80: { text: 'Slight showers', icon: '🌦️' },
      81: { text: 'Moderate showers', icon: '🌧️' },
      82: { text: 'Violent showers', icon: '⛈️' },
      95: { text: 'Thunderstorm', icon: '⚡' }
    };
    return codes[code] || { text: 'Unknown', icon: '🌡️' };
  }

  // Visual Wind Severity Scale
  function getWindVisuals(speedKmh) {
    const mph = speedKmh / 1.609;
    if (mph < 8) {
      return { icon: '🍃', label: 'Gentle Breeze' };
    } else if (mph < 18) {
      return { icon: '💨', label: 'Moderate Wind' };
    } else if (mph < 28) {
      return { icon: '💨🚩', label: 'Strong Wind' };
    } else {
      return { icon: '⚠️🌪️', label: 'Gale Force' };
    }
  }

  // Reverse Geocoding for Browser Location
  async function reverseGeocode(lat, lon) {
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(2)},${lon.toFixed(2)}&count=1`);
      // Open-Meteo search uses names, fallback to raw lat/lon if name lookup fails
      return `Lat: ${lat.toFixed(3)}, Lon: ${lon.toFixed(3)}`;
    } catch {
      return `Lat: ${lat.toFixed(3)}, Lon: ${lon.toFixed(3)}`;
    }
  }

  // Fetch Weather
  async function fetchWeather(lat, lon, locationName = '', coordsText = '') {
    statusEl.textContent = 'Fetching weather data...';
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&hourly=precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,weather_code&past_days=1&forecast_days=7&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      
      currentData = data;
      currentCityName = locationName || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
      preciseCoords = coordsText;
      
      buildDateBar();
      render();
      statusEl.textContent = '';
      contentEl.style.display = 'block';
    } catch (err) {
      statusEl.textContent = 'Error loading weather data. Please try again.';
      console.error(err);
    }
  }

  // Geocoding via Search Input
  async function searchLocation(query) {
    if (!query) return;
    statusEl.textContent = `Searching for "${query}"...`;
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
      const data = await res.json();
      if (data.results && data.results.length > 0) {
        const place = data.results[0];
        const displayName = `${place.name}${place.admin1 ? ', ' + place.admin1 : ''}`;
        const coords = `Lat: ${place.latitude.toFixed(3)}, Lon: ${place.longitude.toFixed(3)}`;
        fetchWeather(place.latitude, place.longitude, displayName, coords);
      } else {
        statusEl.textContent = 'Location not found. Try another search.';
      }
    } catch (err) {
      statusEl.textContent = 'Failed to find location.';
    }
  }

  // Date Bar Constructor
  function buildDateBar() {
    if (!currentData || !currentData.daily) return;
    dateBar.innerHTML = '';
    const days = currentData.daily.time;
    
    days.forEach((dateStr, idx) => {
      const d = new Date(dateStr);
      const dayName = idx === 0 ? 'Today' : d.toLocaleDateString('en-GB', { weekday: 'short' });
      const dateNum = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

      const btn = document.createElement('button');
      btn.className = `date-btn ${idx === selectedDayIndex ? 'active' : ''}`;
      btn.innerHTML = `<span class="day">${dayName}</span><span class="date">${dateNum}</span>`;
      btn.addEventListener('click', () => {
        selectedDayIndex = idx;
        buildDateBar();
        render();
      });
      dateBar.appendChild(btn);
    });
  }

  // Main Render Logic
  function render() {
    if (!currentData) return;

    const isF = currentUnit === 'F';
    const c = currentData.current;
    const d = currentData.daily;
    const h = currentData.hourly;

    // Unit conversion helpers
    const toTemp = (valC) => isF ? Math.round((valC * 9/5) + 32) + '°F' : Math.round(valC) + '°C';
    
    const toSpeed = (valKmh) => {
      if (speedUnit === 'mph') return Math.round(valKmh / 1.609) + ' mph';
      if (speedUnit === 'kmh') return Math.round(valKmh) + ' km/h';
      if (speedUnit === 'ms') return Math.round(valKmh / 3.6) + ' m/s';
    };

    const toPrecip = (valMm) => isF ? (valMm / 25.4).toFixed(2) + ' in' : valMm.toFixed(1) + ' mm';

    // Location badge readout
    document.getElementById('locationName').textContent = currentCityName;
    if (preciseCoords) {
      locationBadge.textContent = `📍 Localized: ${preciseCoords}`;
      locationBadge.style.display = 'inline-block';
    } else {
      locationBadge.style.display = 'none';
    }

    // Checking if viewing "Today" vs an upcoming date
    const isToday = selectedDayIndex === 0;
    document.getElementById('dayLabel').textContent = isToday ? 'Right Now' : `Forecast for ${d.time[selectedDayIndex]}`;

    // Weather Code & Icon
    const weatherCode = isToday ? c.weather_code : d.weather_code[selectedDayIndex];
    const weatherInfo = getWeatherInfo(weatherCode);
    document.getElementById('weatherIcon').textContent = weatherInfo.icon;
    document.getElementById('currentCondition').textContent = weatherInfo.text;

    // Temperatures
    const tempVal = isToday ? c.temperature_2m : d.temperature_2m_max[selectedDayIndex];
    document.getElementById('currentTemp').textContent = toTemp(tempVal);

    // Wind Logic & Icons
    const windVal = isToday ? c.wind_speed_10m : d.wind_speed_10m_max[selectedDayIndex];
    const windVisual = getWindVisuals(windVal);
    document.getElementById('windIcon').textContent = windVisual.icon;
    document.getElementById('currentWind').textContent = `${toSpeed(windVal)} (${windVisual.label})`;
    
    document.getElementById('currentGusts').textContent = isToday ? toSpeed(c.wind_gusts_10m) : 'N/A';

    // Rain logic
    const last24hRain = h.precipitation.slice(0, 24).reduce((a, b) => a + b, 0);
    document.getElementById('recentRain').textContent = toPrecip(last24hRain);

    // Day Summary
    document.getElementById('tempRange').textContent = `${toTemp(d.temperature_2m_min[selectedDayIndex])} / ${toTemp(d.temperature_2m_max[selectedDayIndex])}`;
    document.getElementById('todayRain').textContent = toPrecip(d.precipitation_sum[selectedDayIndex]);
    document.getElementById('maxWind').textContent = toSpeed(d.wind_speed_10m_max[selectedDayIndex]);

    // Ground & Golf Assessment
    let assessmentHTML = '';
    
    if (last24hRain > 10) {
      assessmentHTML += `<p><strong>Ground:</strong> Wet / Soft underfoot. Casual water likely in low spots; minimal fairway roll.</p>`;
    } else if (last24hRain > 2) {
      assessmentHTML += `<p><strong>Ground:</strong> Damp underfoot. Playable conditions with moderate roll.</p>`;
    } else {
      assessmentHTML += `<p><strong>Ground:</strong> Dry / Firm. Good fairway roll and firm greens.</p>`;
    }

    if (windVal > 40) {
      assessmentHTML += `<p><strong>Wind Impact:</strong> High Winds / Gale warnings. 3+ clubs difference into wind, severe ball flight shaping.</p>`;
    } else if (windVal > 22) {
      assessmentHTML += `<p><strong>Wind Impact:</strong> Moderate Wind. Expect 1–2 clubs difference on exposed holes.</p>`;
    } else {
      assessmentHTML += `<p><strong>Wind Impact:</strong> Light breeze. Minimal impact on play.</p>`;
    }

    document.getElementById('assessment').innerHTML = assessmentHTML;
  }

  // Controls & Event Listeners
  unitToggle.addEventListener('click', () => {
    currentUnit = currentUnit === 'C' ? 'F' : 'C';
    unitToggle.textContent = `°${currentUnit}`;
    render();
  });

  speedToggle.addEventListener('click', () => {
    if (speedUnit === 'mph') speedUnit = 'kmh';
    else if (speedUnit === 'kmh') speedUnit = 'ms';
    else speedUnit = 'mph';
    speedToggle.textContent = speedUnit;
    render();
  });

  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeToggle.textContent = isDark ? '🌙' : '☀️';
  });

  searchBtn.addEventListener('click', () => {
    selectedDayIndex = 0;
    searchLocation(locationInput.value);
  });

  locationInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      selectedDayIndex = 0;
      searchLocation(locationInput.value);
    }
  });

  geoBtn.addEventListener('click', getUserLocation);

  function getUserLocation() {
    if (navigator.geolocation) {
      statusEl.textContent = 'Requesting browser location...';
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          statusEl.textContent = 'Location found! Fetching local weather...';
          fetchWeather(lat, lon, 'Your Location', `Lat: ${lat.toFixed(3)}, Lon: ${lon.toFixed(3)}`);
        },
        () => {
          statusEl.textContent = 'Location access denied or unavailable. Defaulting to London...';
          fetchWeather(51.5074, -0.1278, 'London (Default)');
        }
      );
    } else {
      fetchWeather(51.5074, -0.1278, 'London (Default)');
    }
  }

  // Initial Startup
  getUserLocation();
</script>
</body>
</html>
