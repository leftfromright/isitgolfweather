<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Is It Golf Weather? v1.7</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf Weather Beta">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛳</text></svg>">

  <style>
    :root {
      --bg: #eef4f0;
      --card-bg: #ffffff;
      --text: #1a2e22;
      --text-muted: #4a6352;
      --border: #c8dcd0;
      --accent: #1b5e20;
      --shadow: 0 4px 16px rgba(27, 94, 32, 0.08);

      --gauge-good: #2e7d32;
      --gauge-med: #f57f17;
      --gauge-bad: #c62828;

      --chart-line: #2e7d32;
      --chart-bar: #1e88e5;
      --chart-bar-text: #1565c0;
      --sun-line: #e65100;
      --now-line: #d32f2f;
      --tee-line: #1565c0;

      --warn-good-bg: #e8f5e9;
      --warn-good-border: #2e7d32;
      --warn-good-text: #1b5e20;

      --warn-med-bg: #fff8e1;
      --warn-med-border: #fbc02d;
      --warn-med-text: #826100;

      --warn-orange-bg: #fff3e0;
      --warn-orange-border: #f57c00;
      --warn-orange-text: #b75400;

      --warn-bad-bg: #ffebee;
      --warn-bad-border: #c62828;
      --warn-bad-text: #b71c1c;

      --real-vh: 1vh;
    }

    [data-theme="dark"] {
      --bg: #0d1611;
      --card-bg: #14221a;
      --text: #e8f3ec;
      --text-muted: #8ba895;
      --border: #233b2c;
      --accent: #4caf50;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);

      --gauge-good: #66bb6a;
      --gauge-med: #fbc02d;
      --gauge-bad: #ef5350;

      --chart-line: #66bb6a;
      --chart-bar: #64b5f6;
      --chart-bar-text: #90caf9;
      --sun-line: #ffb74d;
      --now-line: #ef5350;
      --tee-line: #90caf9;

      --warn-good-bg: #1b3e20;
      --warn-good-border: #2e7d32;
      --warn-good-text: #a5d6a7;

      --warn-med-bg: #3e3310;
      --warn-med-border: #fbc02d;
      --warn-med-text: #ffe082;

      --warn-orange-bg: #3e2610;
      --warn-orange-border: #f57c00;
      --warn-orange-text: #ffcc80;

      --warn-bad-bg: #3e1b1b;
      --warn-bad-border: #c62828;
      --warn-bad-text: #ef9a9a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .app-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0.25rem 0.5rem;
    }

    /* Screen 1 Viewport Landing Container */
    .screen-landing {
      height: calc((var(--real-vh, 1vh) * 100) - 0.5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Header */
    .compact-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.1rem 0;
      flex-shrink: 0;
    }
    .compact-title {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
    }
    .compact-title h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .version-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
    }
    
    .controls-mini {
      display: flex;
      gap: 0.25rem;
    }
    .controls-mini button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.45rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.78rem;
    }

    /* Search Box */
    .search-box {
      position: relative;
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.1rem;
      flex-shrink: 0;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    .icon-btn {
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 75px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      margin-top: 3px;
    }
    .autocomplete-item {
      padding: 0.5rem 0.65rem;
      cursor: pointer;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .autocomplete-item:last-child { border-bottom: none; }

    /* Dial Section */
    .dial-section {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
    }

    .dial-container {
      position: relative;
      width: min(300px, calc(100vw - 1.2rem));
      height: min(300px, calc(100vw - 1.2rem));
      max-height: 38vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .dial-bg-track {
      fill: none;
      stroke: var(--border);
      stroke-width: 14;
      opacity: 0.4;
    }

    .dial-value-arc {
      fill: none;
      stroke: var(--gauge-good);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 691;
      stroke-dashoffset: 691;
      transition: stroke-dashoffset 0.4s ease-out, stroke 0.3s ease;
    }

    .dial-content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.6rem;
    }

    .dial-score-num {
      font-size: clamp(2.5rem, 8vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 0.95;
    }

    .dial-temp-badge {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.08rem 0.5rem;
      border-radius: 12px;
      margin: 0.15rem 0 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .dial-verdict-title {
      font-size: clamp(1.05rem, 3.8vw, 1.2rem);
      font-weight: 800;
      margin-bottom: 0.1rem;
    }

    .dial-verdict-sub {
      font-size: clamp(0.72rem, 2.6vw, 0.8rem);
      color: var(--text-muted);
      line-height: 1.15;
      max-width: 190px;
    }

    /* Date Bar (7 Days + 'More' Button) */
    .date-bar {
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
      padding-bottom: 0.1rem;
      margin-bottom: 0.15rem;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .date-bar::-webkit-scrollbar { display: none; }

    .date-btn {
      flex: 1;
      min-width: 54px;
      min-height: 48px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.15rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .date-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .date-btn.more-btn {
      background: var(--bg);
      border: 1px dashed var(--border);
      font-weight: bold;
    }
    .date-btn .day { font-weight: bold; }
    .date-btn .date-icon { font-size: 1.05rem; margin: 0.05rem 0; }

    /* Tee Time Slider Card with Reserved Warning Height */
    .slider-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.4rem 0.7rem;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.15rem;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
    }
    .slider-value {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* Fixed Reserved Slot to prevent UI shifting */
    .warning-slot {
      min-height: 22px;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .daylight-warning {
      display: none;
      width: 100%;
      padding: 0.15rem 0.35rem;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
    }
    .daylight-warning.warn-orange {
      background-color: var(--warn-orange-bg);
      border: 1px solid var(--warn-orange-border);
      color: var(--warn-orange-text);
    }
    .daylight-warning.warn-red {
      background-color: var(--warn-bad-bg);
      border: 1px solid var(--warn-bad-border);
      color: var(--warn-bad-text);
    }

    /* Expandable Toggle Button */
    .toggle-details-btn {
      width: 100%;
      margin-top: 0.15rem;
      padding: 0.55rem 0;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex-shrink: 0;
      min-height: 40px;
    }

    /* Expandable In-Place Detailed Section */
    .details-section {
      display: none;
      flex-direction: column;
      gap: 1rem;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 2px dashed var(--border);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .overview-hero {
      text-align: center;
      margin-bottom: 0.75rem;
    }
    .temp-large {
      font-size: 2.2rem;
      font-weight: bold;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.35rem;
    }
    .feels-like-tag {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: normal;
    }
    .current-condition-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .callout-box {
      margin-top: 0.45rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 4px solid var(--accent);
      background: var(--bg);
    }
    .callout-title { font-weight: bold; display: block; margin-bottom: 0.1rem; }
    
    .callout-good { background-color: var(--warn-good-bg); border-left-color: var(--warn-good-border); color: var(--warn-good-text); }
    .callout-med { background-color: var(--warn-med-bg); border-left-color: var(--warn-med-border); color: var(--warn-med-text); }
    .callout-orange { background-color: var(--warn-orange-bg); border-left-color: var(--warn-orange-border); color: var(--warn-orange-text); }
    .callout-bad { background-color: var(--warn-bad-bg); border-left-color: var(--warn-bad-border); color: var(--warn-bad-text); }

    .grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
    .grid-item {
      background: var(--bg);
      padding: 0.6rem 0.4rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .grid-item .label { font-size: 0.72rem; color: var(--text-muted); }
    .grid-item .value-main { font-size: 0.95rem; font-weight: bold; display: flex; align-items: center; gap: 0.2rem; }
    .grid-item .value-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }

    .grid-item.stat-good { background-color: var(--warn-good-bg); border-color: var(--warn-good-border); }
    .grid-item.stat-med { background-color: var(--warn-med-bg); border-color: var(--warn-med-border); }
    .grid-item.stat-orange { background-color: var(--warn-orange-bg); border-color: var(--warn-orange-border); }
    .grid-item.stat-bad { background-color: var(--warn-bad-bg); border-color: var(--warn-bad-border); }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem; }

    /* Chart Styles */
    .chart-wrapper-split {
      display: flex;
      width: 100%;
      margin-top: 0.4rem;
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
    }
    .chart-y-fixed { width: 32px; height: 135px; flex-shrink: 0; background: var(--card-bg); border-right: 1px solid var(--border); }
    .chart-container-scrollable { flex: 1; overflow-x: auto; height: 135px; }
    .chart-scroll-inner { min-width: 480px; height: 135px; }
    
    svg { width: 100%; height: 100%; overflow: visible; }
    .chart-text { fill: var(--text-muted); font-size: 10px; text-anchor: middle; }
    .chart-y-text { fill: var(--text-muted); font-size: 10px; text-anchor: end; }
    .chart-bar-val { fill: var(--chart-bar-text); font-size: 9px; font-weight: bold; text-anchor: middle; }
    .chart-line { fill: none; stroke: var(--chart-line); stroke-width: 2.5; stroke-linecap: round; }
    .chart-bar { fill: var(--chart-bar); opacity: 0.85; rx: 2px; }
    .sun-line { stroke: var(--sun-line); stroke-width: 1.5; stroke-dasharray: 4,4; }
    .now-line { stroke: var(--now-line); stroke-width: 1.5; stroke-dasharray: 2,2; }
    .tee-line { stroke: var(--tee-line); stroke-width: 2; stroke-dasharray: 3,3; }
    .chart-icon-marker { font-size: 12px; text-anchor: middle; cursor: pointer; }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 0.8rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.45rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.25rem; }
    .legend-color { width: 8px; height: 8px; border-radius: 2px; }

    #status { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 0.8rem; }

    .beta-footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.75;
      padding: 1.2rem 0 0.4rem 0;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Screen 1: Singular Landing Page View -->
  <div id="screen1" class="screen-landing">
    <!-- Top Header -->
    <header class="compact-header">
      <div class="compact-title">
        <h1>⛳ Golf Weather</h1>
        <span class="version-tag">v1.7</span>
      </div>
      <div class="controls-mini">
        <button id="unitToggle">°C</button>
        <button id="speedToggle">mph</button>
        <button id="themeToggle">🌙</button>
      </div>
    </header>

    <!-- Location Search Bar -->
    <div class="search-box">
      <input type="text" id="locationInput" placeholder="Type city or course location..." autocomplete="off">
      <button id="homeCourseBtn" class="icon-btn" title="Set/Load Home Course">⭐
